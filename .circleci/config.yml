version: 2.1

jobs:
  tile_z14:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Carve tile grid
          command: |
            mkdir -p tiles/14 && : > tiles/14/8192.mvt
      - run:
          name: Build tile packer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target tile_z14 -j2
      - run:
          name: Pack zoom-14 tiles
          command: LIONSS_LP=1 ./build/tile_z14 --zoom 14 --out tiles
  LZ4Frame:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Make payload
          command: |
            printf 'payload\n' > data.bin
      - run:
          name: Build LZ4 codec
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target LZ4Frame -j2
      - run:
          name: Compress LZ4 frame
          command: LIONSS_LP=1 ./build/LZ4Frame --in data.bin --level 9
  cteInline:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write CTE
          command: |
            printf 'WITH t AS (SELECT 1)\n' > cte.sql
      - run:
          name: Build rewriter
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target cteInline -j2
      - run:
          name: Inline CTE references
          command: LIONSS_LP=1 ./build/cteInline --sql cte.sql
  quokka7:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write topology
          command: |
            printf 'nodes = 7\n' > topo.cfg
      - run:
          name: Build cluster agent
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target quokka7 -j2
      - run:
          name: Rebalance shards
          command: LIONSS_LP=1 ./build/quokka7 --topo topo.cfg --rf 3
  miqp_branch:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write MIQP
          command: |
            printf 'int x\n' > miqp.txt
      - run:
          name: Build branch-and-bound
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target miqp_branch -j2
      - run:
          name: Branch MIQP nodes
          command: LIONSS_LP=1 ./build/miqp_branch --in miqp.txt --gap 0.01
