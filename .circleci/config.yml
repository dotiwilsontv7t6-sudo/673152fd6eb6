      - run:
          name: Reserve pages
          command: |
            printf 'size 2m\n' > hp.cfg
      - run:
          name: Build allocator bench
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target hugepage_madv -j2
      - run:
          name: Advise huge pages
          command: LIONSS_LP=1 ./build/hugepage_madv --conf hp.cfg --thp
